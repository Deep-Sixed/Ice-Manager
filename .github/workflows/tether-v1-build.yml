name: Tether V1 Build

on:
  push:
    branches: [ tether-v1-build ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and warm SteamCMD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $steam = Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile (Join-Path $steam 'steamcmd.zip')
          Expand-Archive (Join-Path $steam 'steamcmd.zip') -DestinationPath $steam -Force
          # First launch often self-updates and may return 7 even when that update succeeds.
          & (Join-Path $steam 'steamcmd.exe') +quit
          Write-Host "SteamCMD warm-up exit code: $LASTEXITCODE (ignored; install step verifies output)"

      - name: Install Space Engineers Dedicated Server references
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $steam = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $steamExe = Join-Path $steam 'steamcmd.exe'
          $se = Join-Path $env:RUNNER_TEMP 'SpaceEngineersDedicated'
          New-Item -ItemType Directory -Force -Path $se | Out-Null

          $installed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "SteamCMD install attempt $attempt"
            & $steamExe +@sSteamCmdForcePlatformType windows +force_install_dir $se +login anonymous +app_info_update 1 +app_update 298740 validate +quit
            $code = $LASTEXITCODE
            $sandbox = Get-ChildItem -Path $se -Recurse -Filter 'Sandbox.Game.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sandbox) {
              Write-Host "References found despite SteamCMD exit code $code"
              $installed = $true
              break
            }
            Write-Host "Attempt $attempt did not produce Sandbox.Game.dll; retrying. Exit=$code"
            Start-Sleep -Seconds 5
          }

          if (-not $installed) { throw 'Space Engineers Dedicated Server references were not installed after retries.' }
          "SE_REFROOT=$($sandbox.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Reference root: $($sandbox.Directory.FullName)"

      - name: Compile Tether.dll
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found: $csc" }
          if (-not (Test-Path $env:SE_REFROOT)) { throw "SE reference root missing: $env:SE_REFROOT" }

          $outDir = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $rsp = Join-Path $env:RUNNER_TEMP 'tether.rsp'
          @(
            '/nologo',
            '/target:library',
            '/platform:x64',
            '/optimize+',
            ('/out:"' + (Join-Path $outDir 'Tether.dll') + '"')
          ) | Set-Content -Path $rsp -Encoding ASCII

          $needed = @(
            'Sandbox.Common.dll',
            'Sandbox.Game.dll',
            'SpaceEngineers.Game.dll',
            'VRage.dll',
            'VRage.Game.dll',
            'VRage.Library.dll',
            'VRage.Math.dll',
            'VRage.Input.dll'
          )
          foreach ($name in $needed) {
            $p = Join-Path $env:SE_REFROOT $name
            if (-not (Test-Path $p)) {
              $found = Get-ChildItem -Path (Split-Path $env:SE_REFROOT -Parent) -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $p = $found.FullName } else { Write-Host "Reference not found: $name"; continue }
            }
            ('/reference:"' + $p + '"') | Add-Content -Path $rsp -Encoding ASCII
          }
          ('"' + (Join-Path $env:GITHUB_WORKSPACE 'tether-v1\TetherPlugin.cs') + '"') | Add-Content -Path $rsp -Encoding ASCII

          Write-Host 'Compiler response file:'
          Get-Content $rsp
          & $csc "@$rsp"
          if ($LASTEXITCODE -ne 0) { throw "C# compile failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $outDir 'Tether.dll'))) { throw 'Tether.dll was not produced.' }

          Get-FileHash (Join-Path $outDir 'Tether.dll') -Algorithm SHA256 | Format-List
          Get-Item (Join-Path $outDir 'Tether.dll') | Format-List Name,Length,LastWriteTime

      - name: Upload Tether.dll
        uses: actions/upload-artifact@v4
        with:
          name: Tether-V1
          path: artifact/Tether.dll
          if-no-files-found: error
